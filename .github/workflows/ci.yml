name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  python:
    name: Python 测试与问答评测门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: 单元测试
        run: python -m pytest -q
      - name: 构建 RAG 索引
        run: python -m scripts.build_rag_index --force
      - name: 问答回归门禁（120 题，准确率 ≥ 90%）
        run: python -m scripts.evaluate_qa --fail-under 0.9
      - name: Agent 冒烟测试（24 题）
        run: python -m scripts.verify_agent

  website:
    name: 网站 lint 与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装依赖
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: 构建
        run: npm run build
