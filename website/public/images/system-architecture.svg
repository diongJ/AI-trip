<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">南越数字博物志公开 Demo 系统架构</title>
  <desc id="desc">浏览器通过 Railway 同域网页与 API 访问可信问答 Agent。Agent 查询 RAG、图谱和经证据约束的 DeepSeek，服务异常时回退到离线答案。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#39434a"/></marker>
    <style>
      .title{font:700 34px Arial,'Microsoft YaHei',sans-serif;fill:#30271f}.sub{font:18px Arial,'Microsoft YaHei',sans-serif;fill:#716758}.h{font:700 22px Arial,'Microsoft YaHei',sans-serif;fill:#30271f}.t{font:17px Arial,'Microsoft YaHei',sans-serif;fill:#4e463c}.small{font:15px Arial,'Microsoft YaHei',sans-serif;fill:#5d554c}.edge{fill:none;stroke:#39434a;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#39434a;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#arrow)}.label{font:15px Arial,'Microsoft YaHei',sans-serif;fill:#39434a}.box{stroke-width:2.5}.rail{fill:#faf7f0;stroke:#b8a888;stroke-width:2.5;stroke-dasharray:10 7}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fffdf8"/>
  <text x="72" y="70" class="title">南越数字博物志 · 公开 Demo 架构</text>
  <text x="72" y="106" class="sub">同域网页与 API · 证据优先 · DeepSeek 异常自动回退</text>

  <rect x="318" y="152" width="1035" height="650" rx="20" class="rail"/>
  <text x="357" y="196" class="h">Railway 常在线服务</text>

  <rect x="72" y="394" width="186" height="118" rx="14" fill="#edf7ef" stroke="#2f6d49" class="box"/>
  <text x="165" y="442" text-anchor="middle" class="h">评委 / 访客</text><text x="165" y="472" text-anchor="middle" class="t">浏览器</text>

  <rect x="365" y="260" width="225" height="120" rx="14" fill="#fff4e5" stroke="#a65325" class="box"/>
  <text x="478" y="310" text-anchor="middle" class="h">React 数字博物志</text><text x="478" y="340" text-anchor="middle" class="t">问答 · 图谱 · 文物页</text>
  <rect x="365" y="526" width="225" height="112" rx="14" fill="#eef3fb" stroke="#385a8b" class="box"/>
  <text x="478" y="571" text-anchor="middle" class="h">FastAPI 同域服务</text><text x="478" y="602" text-anchor="middle" class="t">静态页面 + /api</text>

  <rect x="680" y="526" width="194" height="112" rx="14" fill="#eef3fb" stroke="#385a8b" class="box"/>
  <text x="777" y="570" text-anchor="middle" class="h">单 IP 限流</text><text x="777" y="601" text-anchor="middle" class="t">429 + Retry-After</text>
  <rect x="966" y="432" width="266" height="158" rx="14" fill="#eef3fb" stroke="#385a8b" class="box"/>
  <text x="1099" y="480" text-anchor="middle" class="h">可信问答 Agent</text><text x="1099" y="512" text-anchor="middle" class="t">路由 · 引用 · 证据校验</text><text x="1099" y="542" text-anchor="middle" class="t">失败时离线降级</text>

  <rect x="966" y="246" width="266" height="112" rx="14" fill="#f5effa" stroke="#75528d" class="box"/>
  <text x="1099" y="291" text-anchor="middle" class="h">BM25 / RAG 索引</text><text x="1099" y="322" text-anchor="middle" class="t">220 份可信资料</text>
  <rect x="966" y="654" width="266" height="112" rx="14" fill="#f5effa" stroke="#75528d" class="box"/>
  <text x="1099" y="699" text-anchor="middle" class="h">本地图谱 V1</text><text x="1099" y="730" text-anchor="middle" class="t">78 实体 · 87 关系</text>

  <rect x="1372" y="220" width="178" height="126" rx="14" fill="#f8eeee" stroke="#9d4d4d" class="box"/>
  <text x="1461" y="268" text-anchor="middle" class="h">DeepSeek</text><text x="1461" y="298" text-anchor="middle" class="t">服务端调用</text>
  <rect x="1372" y="612" width="178" height="126" rx="14" fill="#f5effa" stroke="#75528d" class="box"/>
  <text x="1461" y="659" text-anchor="middle" class="h">版本化语料</text><text x="1461" y="689" text-anchor="middle" class="t">来源 · 哈希 · 时效</text>

  <path d="M258 453 H365" class="edge"/><text x="292" y="432" class="label">HTTPS</text>
  <path d="M478 380 V526" class="edge"/><path d="M450 526 V380" class="edge"/><text x="505" y="462" class="label">同域 /api</text>
  <path d="M590 582 H680" class="edge"/><path d="M874 582 H966" class="edge"/>
  <path d="M1099 432 V358" class="edge"/><text x="1120" y="405" class="label">检索</text>
  <path d="M1099 590 V654" class="edge"/><text x="1120" y="632" class="label">关系查询</text>
  <path d="M1232 484 L1372 328" class="dash"/><path d="M1372 361 L1232 511" class="dash"/><text x="1260" y="410" class="label">证据综合</text>
  <path d="M1372 654 H1232" class="edge"/><text x="1258" y="634" class="label">构建 / 审核</text>
  <path d="M1372 714 L1232 724" class="edge"/>

  <text x="72" y="857" class="small">生产默认关闭语义模型；DeepSeek、Neo4j 不可用时仍由 BM25、本地图谱与离线证据回答完成核心演示。</text>
</svg>
